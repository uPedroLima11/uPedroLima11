<svg xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="305"
  viewBox="0 0 800 305"
  role="img"
  aria-labelledby="title description">

  <title id="title">GitHub Stats de Pedro Lima</title>

  <desc id="description">
    1063 commits,
    34 repositórios,
    27 pull requests.
    Repositórios mais ativos: 1: StockControl_Frontend, 324 commits; 2: quadra_adm, 187 commits; 3: React-Portifolio, 120 commits.
