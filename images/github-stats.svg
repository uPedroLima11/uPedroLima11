  </a>
  <text class="repo-count" x="758" y="198" text-anchor="end">324 commits</text>
  <text class="position" x="42" y="236">2.</text>
  <a href="https://github.com/RLima-Rodrigo/quadra_adm">
    <text class="repo" x="72" y="236">🔒 quadra_adm</text>
  </a>
  <text class="repo-count" x="758" y="236" text-anchor="end">187 commits</text>
  <text class="position" x="42" y="274">3.</text>
  <a href="https://github.com/uPedroLima11/React-Portifolio">
    <text class="repo" x="72" y="274">React-Portifolio</text>
  </a>
  <text class="repo-count" x="758" y="274" text-anchor="end">120 commits</text>
